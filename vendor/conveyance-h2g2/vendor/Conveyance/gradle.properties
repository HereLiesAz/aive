# AGP 9.4's lint analysis engine (Kotlin Analysis API-backed) needs more Metaspace than 512m to
# load its light classes without an OutOfMemoryError -- confirmed by reproducing the failure at
# 512m and clearing it at 1536m; 384m of headroom above that failure point, not a guess.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1536m
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
