# The Aive remote relay: forwards opaque frames between a paired
# Aive device (host) and IDEaz (clients). Protocol: the "Relay" section of docs/Remote-API.md.
name = "aive-relay"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RemoteRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RemoteRoom"]
