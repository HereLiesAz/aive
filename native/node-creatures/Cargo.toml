[package]
name = "haive-node-creatures"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Deterministic 3D node-creature generator, animator, and flat-vector render core for Haive"

[lib]
crate-type = ["rlib", "cdylib"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jni = { version = "0.21.1", default-features = false }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
