[package]
name = "djl_tokenizer"
version = "0.38.0"
edition = "2021"
description = "DJL HuggingFace tokenizer JNI library for Android, rebuilt with 16 KB page alignment"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to the versions DJL v0.38.0 builds against.
jni = "0.21.1"
tokenizers = "0.21.1"

[profile.release]
strip = true
