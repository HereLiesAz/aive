<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D1026" />
    <meta name="application-name" content="The Haive" />
    <meta name="description" content="The Haive — governed workflow orchestration across people, agents, and automated executors." />
    <title>The Haive</title>
    <link rel="icon" type="image/png" sizes="64x64" href="haive-icon-64.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="haive-icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preload" as="image" href="haive_loader.gif" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div id="haiveSplash" role="status" aria-live="polite" aria-label="Loading The Haive">
        <img id="haiveSplashFrame0" src="haive_loader_frame0.png" alt="" aria-hidden="true" />
        <img id="haiveSplashAnimation" src="haive_loader.gif" alt="" aria-hidden="true" />
    </div>
    <div id="webApp"></div>
    <script>
        (() => {
            const app = document.getElementById("webApp");
            const splash = document.getElementById("haiveSplash");
            const frame0 = document.getElementById("haiveSplashFrame0");
            const animation = document.getElementById("haiveSplashAnimation");
            if (!app || !splash) return;

            const revealAnimation = () => {
                if (!animation || !frame0) return;
                animation.classList.add("haive-loader-running");
                frame0.classList.add("haive-loader-replaced");
            };

            if (animation) {
                if (animation.complete) {
                    revealAnimation();
                } else {
                    animation.addEventListener("load", revealAnimation, { once: true });
                }
            }

            const dismissSplash = () => {
                splash.classList.add("haive-splash-ready");
                window.setTimeout(() => splash.remove(), 220);
            };

            if (app.childNodes.length > 0) {
                dismissSplash();
                return;
            }

            const observer = new MutationObserver(() => {
                if (app.childNodes.length === 0) return;
                observer.disconnect();
                requestAnimationFrame(dismissSplash);
            });
            observer.observe(app, { childList: true });
        })();
    </script>
    <script src="node-creatures.js"></script>
    <script>
        (() => {
            const launchHaive = () => {
                const script = document.createElement("script");
                script.src = "haive.js";
                script.async = false;
                document.body.appendChild(script);
            };

            const renderer = globalThis.HaiveNodeCreatures;
            if (!renderer || typeof renderer.init !== "function") {
                console.error("Node-creature browser adapter is unavailable; starting Haive with the compatibility renderer.");
                launchHaive();
                return;
            }

            renderer.init("haive_node_creatures.wasm")
                .catch((error) => {
                    console.error("Rust node-creature renderer failed to initialize; starting Haive with the compatibility renderer.", error);
                })
                .finally(launchHaive);
        })();
    </script>
</body>
</html>
