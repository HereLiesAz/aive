<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D1026" />
    <meta name="application-name" content="The Aive" />
    <meta name="description" content="The Aive — governed workflow orchestration across people, agents, and automated executors." />
    <title>The Aive</title>
    <link rel="icon" type="image/png" sizes="64x64" href="haive-icon-64.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="haive-icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div id="haiveSplash" role="status" aria-live="polite" aria-label="Loading The Aive">
        <img id="haiveSplashFrame0" src="haive_loader_frame0.png" alt="" aria-hidden="true" />
        <img id="haiveSplashAnimation" data-src="haive_loader.gif" alt="" aria-hidden="true" />
    </div>
    <div id="webApp"></div>
    <script>
        (() => {
            const app = document.getElementById("webApp");
            const splash = document.getElementById("haiveSplash");
            const frame0 = document.getElementById("haiveSplashFrame0");
            const animation = document.getElementById("haiveSplashAnimation");
            if (!app || !splash) return;

            const revealAnimation = () => {
                if (!animation || !frame0) return;
                animation.classList.add("haive-loader-running");
                frame0.classList.add("haive-loader-replaced");
            };

            const reduceMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches === true;
            if (animation && !reduceMotion) {
                animation.addEventListener("load", revealAnimation, { once: true });
                animation.src = animation.dataset.src;
                if (animation.complete) revealAnimation();
            } else if (animation) {
                animation.remove();
            }

            const dismissSplash = () => {
                splash.classList.add("haive-splash-ready");
                window.setTimeout(() => splash.remove(), 220);
            };

            if (app.childNodes.length > 0) {
                dismissSplash();
                return;
            }

            const observer = new MutationObserver(() => {
                if (app.childNodes.length === 0) return;
                observer.disconnect();
                requestAnimationFrame(dismissSplash);
            });
            observer.observe(app, { childList: true });
        })();
    </script>
    <script src="mesh-crypto.js"></script>
    <script src="node-creatures.js"></script>
    <script>
        (() => {
            const failStartup = (message, error) => {
                console.error(message, error || "");
                globalThis.__haiveStartupError = error ? `${message} ${error}` : message;
                const splash = document.getElementById("haiveSplash");
                if (splash) {
                    splash.setAttribute("aria-label", "The Aive failed to start");
                    splash.dataset.startupError = globalThis.__haiveStartupError;
                }
            };

            const normalizeBrowserLocale = () => {
                const candidates = [
                    navigator.language,
                    ...(Array.isArray(navigator.languages) ? navigator.languages : []),
                    document.documentElement.lang,
                    "en-US",
                ];
                let locale = "en-US";
                for (const candidate of candidates) {
                    if (typeof candidate !== "string" || !candidate.trim()) continue;
                    try {
                        const normalized = candidate.trim().replaceAll("_", "-");
                        const canonical = Intl.getCanonicalLocales(normalized)[0];
                        if (canonical) {
                            locale = canonical;
                            break;
                        }
                    } catch (_) {
                        // Keep trying until a valid BCP-47 locale is found.
                    }
                }

                document.documentElement.lang = locale;
                try {
                    Object.defineProperty(navigator, "language", {
                        configurable: true,
                        get: () => locale,
                    });
                    Object.defineProperty(navigator, "languages", {
                        configurable: true,
                        get: () => [locale],
                    });
                } catch (_) {
                    // Some browsers expose non-configurable Navigator properties. The document
                    // language remains a valid fallback for Compose in that case.
                }
                globalThis.__haiveBrowserLocale = locale;
                return locale;
            };

            const loadHaive = () => new Promise((resolve, reject) => {
                const script = document.createElement("script");
                script.src = "haive.js";
                script.onload = resolve;
                script.onerror = () => reject(new Error("Could not load haive.js."));
                document.body.appendChild(script);
            });

            const renderer = globalThis.HaiveNodeCreatures;
            if (!renderer || typeof renderer.init !== "function") {
                failStartup("Node-creature browser adapter is unavailable.");
                return;
            }

            normalizeBrowserLocale();
            renderer.init("haive_node_creatures.wasm")
                .then(() => {
                    if (!renderer.ready) {
                        throw new Error("Rust renderer initialization completed without becoming ready.");
                    }
                    globalThis.__haiveNodeCreaturesReady = true;
                    return loadHaive();
                })
                .then(() => {
                    globalThis.__haiveAppScriptLoaded = true;
                })
                .catch((error) => {
                    failStartup("The Aive could not initialize the Rust node-creature renderer.", error);
                });
        })();
    </script>
</body>
</html>
