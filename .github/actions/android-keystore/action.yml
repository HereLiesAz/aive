name: Prepare Android signing keystore
description: Rebuild and verify the Android release keystore from split repository secrets.

inputs:
  keystore-private:
    description: KEYSTORE_PRIVATE — private key in PEM or base64-wrapped PEM/DER.
    required: false
    default: ''
  keystore-rsa:
    description: KEYSTORE_RSA — alternate private key source when KEYSTORE_PRIVATE is empty.
    required: false
    default: ''
  keystore-public:
    description: KEYSTORE_PUBLIC — signing certificate in PEM or base64-wrapped PEM/DER.
    required: false
    default: ''
  keystore-chain:
    description: KEYSTORE_CHAIN — certificate chain in PEM or base64-wrapped PEM/DER.
    required: false
    default: ''
  keystore-password:
    description: KEYSTORE_PASSWORD — keystore password.
    required: true
  key-alias:
    description: KEY_ALIAS — signing-key alias.
    required: true
  key-password:
    description: KEY_PASSWORD — key password; defaults to store password when empty.
    required: false
    default: ''
  expected-sha256:
    description: KEYSTORE_SHA256 — expected certificate SHA-256 fingerprint.
    required: false
    default: ''
  expected-sha1:
    description: KEYSTORE_SHA1 — expected certificate SHA-1 fingerprint.
    required: false
    default: ''
  expected-owner:
    description: KEYSTORE_OWNER — expected certificate Owner DN.
    required: false
    default: ''

outputs:
  keystore-path:
    description: Absolute path to the reconstructed PKCS#12 keystore.
    value: ${{ steps.prepare.outputs.keystore-path }}
  store-type:
    description: Keystore type.
    value: ${{ steps.prepare.outputs.store-type }}
  sha256:
    description: Verified signing-certificate SHA-256 fingerprint.
    value: ${{ steps.prepare.outputs.sha256 }}

runs:
  using: composite
  steps:
    - id: prepare
      shell: bash
      env:
        KEYSTORE_PRIVATE: ${{ inputs.keystore-private }}
        KEYSTORE_RSA: ${{ inputs.keystore-rsa }}
        KEYSTORE_PUBLIC: ${{ inputs.keystore-public }}
        KEYSTORE_CHAIN: ${{ inputs.keystore-chain }}
        KEYSTORE_PASSWORD: ${{ inputs.keystore-password }}
        KEY_ALIAS: ${{ inputs.key-alias }}
        KEY_PASSWORD: ${{ inputs.key-password }}
        EXPECTED_SHA256: ${{ inputs.expected-sha256 }}
        EXPECTED_SHA1: ${{ inputs.expected-sha1 }}
        EXPECTED_OWNER: ${{ inputs.expected-owner }}
      run: |
        set -euo pipefail

        work="$RUNNER_TEMP/haive-signing"
        mkdir -p "$work"
        chmod 700 "$work"

        if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
          echo "::error::KEYSTORE_PASSWORD is empty or unset."
          exit 1
        fi
        if [ -z "${KEY_ALIAS:-}" ]; then
          echo "::error::KEY_ALIAS is empty or unset."
          exit 1
        fi
        if [ -z "${KEY_PASSWORD:-}" ]; then
          KEY_PASSWORD="$KEYSTORE_PASSWORD"
        fi
        export KEYSTORE_PASSWORD KEY_PASSWORD

        materialise() {
          local value="$1" out="$2"
          [ -n "$value" ] || return 1
          printf '%s' "$value" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' > "$work/.in"
          if head -c 11 "$work/.in" | grep -q -- "-----BEGIN"; then
            cp "$work/.in" "$out"
          elif tr -d '[:space:]' < "$work/.in" | base64 --decode > "$out" 2>/dev/null && [ -s "$out" ]; then
            :
          else
            cp "$work/.in" "$out"
          fi
          rm -f "$work/.in"
          [ -s "$out" ]
        }

        key_pem="$work/key.pem"
        cert_pem="$work/cert.pem"
        chain_pem="$work/chain.pem"
        keystore="$work/haive-release.p12"

        if ! materialise "${KEYSTORE_PRIVATE:-}" "$key_pem"; then
          materialise "${KEYSTORE_RSA:-}" "$key_pem" || true
        fi
        if [ ! -s "$key_pem" ]; then
          echo "::error::Neither KEYSTORE_PRIVATE nor KEYSTORE_RSA contains a usable private key."
          exit 1
        fi
        if ! grep -q -- "-----BEGIN" "$key_pem"; then
          openssl pkey -inform DER -in "$key_pem" -out "$work/key.converted.pem" 2>/dev/null \
            || openssl rsa -inform DER -in "$key_pem" -out "$work/key.converted.pem" 2>/dev/null \
            || { echo "::error::The private key is neither readable PEM nor DER."; exit 1; }
          mv "$work/key.converted.pem" "$key_pem"
        fi

        if ! materialise "${KEYSTORE_PUBLIC:-}" "$cert_pem"; then
          materialise "${KEYSTORE_CHAIN:-}" "$cert_pem" || {
            echo "::error::No signing certificate found in KEYSTORE_PUBLIC or KEYSTORE_CHAIN."
            exit 1
          }
        fi
        if grep -q "BEGIN PUBLIC KEY" "$cert_pem" 2>/dev/null; then
          materialise "${KEYSTORE_CHAIN:-}" "$cert_pem" || {
            echo "::error::KEYSTORE_PUBLIC is only a public key and KEYSTORE_CHAIN has no certificate."
            exit 1
          }
        fi

        extra_certs=()
        if materialise "${KEYSTORE_CHAIN:-}" "$chain_pem" && ! cmp -s "$chain_pem" "$cert_pem"; then
          extra_certs=(-certfile "$chain_pem")
        fi

        assembled="$work/assembled.p12"
        openssl pkcs12 -export \
          -inkey "$key_pem" \
          -in "$cert_pem" \
          "${extra_certs[@]}" \
          -name "$KEY_ALIAS" \
          -passout env:KEYSTORE_PASSWORD \
          -out "$assembled"

        keytool -importkeystore \
          -srckeystore "$assembled" -srcstoretype PKCS12 -srcstorepass:env KEYSTORE_PASSWORD \
          -srcalias "$KEY_ALIAS" \
          -destkeystore "$keystore" -deststoretype PKCS12 \
          -deststorepass:env KEYSTORE_PASSWORD -destkeypass:env KEY_PASSWORD \
          -destalias "$KEY_ALIAS" -noprompt

        rm -f "$assembled" "$key_pem" "$cert_pem" "$chain_pem"
        chmod 600 "$keystore"

        if ! keytool -list -v -keystore "$keystore" -storetype PKCS12 \
              -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > "$work/cert.txt" 2>"$work/cert.err"; then
          echo "::error::Reconstructed keystore does not contain alias '$KEY_ALIAS', or KEYSTORE_PASSWORD is wrong."
          cat "$work/cert.err" || true
          exit 1
        fi

        entry_type=$(grep -m1 '^Entry type:' "$work/cert.txt" | sed 's/^Entry type: *//' | tr -d '\r')
        if [ "$entry_type" != "PrivateKeyEntry" ]; then
          echo "::error::Alias '$KEY_ALIAS' is '$entry_type', not PrivateKeyEntry."
          exit 1
        fi

        norm() { tr -d ': \t' | tr '[:lower:]' '[:upper:]'; }
        actual_sha256=$(grep -m1 'SHA256:' "$work/cert.txt" | sed 's/.*SHA256: *//' | tr -d '\r')
        actual_sha1=$(grep -m1 'SHA1:' "$work/cert.txt" | sed 's/.*SHA1: *//' | tr -d '\r')
        actual_owner=$(grep -m1 '^Owner:' "$work/cert.txt" | sed 's/^Owner: *//' | tr -d '\r')

        echo "Signing certificate"
        echo "  Owner:   $actual_owner"
        echo "  SHA-1:   $actual_sha1"
        echo "  SHA-256: $actual_sha256"

        fail=0
        if [ -n "${EXPECTED_SHA256:-}" ] && \
           [ "$(printf '%s' "$actual_sha256" | norm)" != "$(printf '%s' "$EXPECTED_SHA256" | norm)" ]; then
          echo "::error::Certificate SHA-256 does not match KEYSTORE_SHA256."
          fail=1
        fi
        if [ -n "${EXPECTED_SHA1:-}" ] && \
           [ "$(printf '%s' "$actual_sha1" | norm)" != "$(printf '%s' "$EXPECTED_SHA1" | norm)" ]; then
          echo "::error::Certificate SHA-1 does not match KEYSTORE_SHA1."
          fail=1
        fi
        if [ -n "${EXPECTED_OWNER:-}" ] && [ "$actual_owner" != "$EXPECTED_OWNER" ]; then
          echo "::warning::Certificate Owner differs from KEYSTORE_OWNER."
        fi
        [ "$fail" -eq 0 ] || exit 1

        {
          echo "keystore-path=$keystore"
          echo "store-type=PKCS12"
          echo "sha256=$actual_sha256"
        } >> "$GITHUB_OUTPUT"

        echo "Reconstructed and verified PKCS#12 keystore for alias '$KEY_ALIAS'."
