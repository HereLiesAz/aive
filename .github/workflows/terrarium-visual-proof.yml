name: Terrarium Visual Proof

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/swarm-terrarium-integration
      - fix/terrarium-rust-visual-proof
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terrarium-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm-screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Rust renderer toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish pinned Conveyance for isolated WASM build
        run: |
          ./gradlew -p vendor/conveyance-h2g2/vendor/Conveyance \
            :conveyance-core:publishToMavenLocal \
            :conveyance-compose:publishToMavenLocal

      - name: Publish pinned H2G2 for isolated WASM build
        run: ./gradlew -p vendor/conveyance-h2g2 publishToMavenLocal

      - name: Build production WASM terrarium
        run: ./gradlew -Phaive.useLocalH2g2=false -Phaive.useMavenLocalH2g2=true :webApp:wasmJsBrowserProductionWebpack

      - name: Stage WASM visual proof
        shell: bash
        run: |
          set -euo pipefail
          WASM_BUNDLE="$(find webApp/build -type f -path '*/wasmJs/productionExecutable/haive.js' -print -quit)"
          if [ -z "$WASM_BUNDLE" ]; then
            echo "::error::WASM production bundle was not found"
            find webApp/build -type f -name 'haive.js' -print
            exit 1
          fi
          WASM_DIR="$(dirname "$WASM_BUNDLE")"
          rm -rf webApp/build/terrarium-proof
          mkdir -p webApp/build/terrarium-proof
          cp -R "$WASM_DIR"/. webApp/build/terrarium-proof/
          cp -R webApp/src/webMain/resources/. webApp/build/terrarium-proof/
          test -f webApp/build/terrarium-proof/index.html
          test -f webApp/build/terrarium-proof/haive.js
          test -f webApp/build/terrarium-proof/node-creatures.js
          test -f webApp/build/terrarium-proof/haive_node_creatures.wasm

      - name: Install Chromium for visual proof
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture and verify real Rust-rendered terrarium
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --directory webApp/build/terrarium-proof > /tmp/haive-terrarium-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            sleep 1
          done
          for asset in haive.js node-creatures.js haive_node_creatures.wasm; do
            curl --fail --silent --output /dev/null "http://127.0.0.1:8080/$asset"
          done

          mkdir -p visual-proof
          cat > visual-proof/haive-terrarium-proof.mjs <<'JS'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const diagnostics = [];
          page.on('console', message => diagnostics.push(`[console:${message.type()}] ${message.text()}`));
          page.on('pageerror', error => diagnostics.push(`[pageerror] ${error.stack || error.message}`));
          page.on('requestfailed', request => diagnostics.push(`[requestfailed] ${request.url()} :: ${request.failure()?.errorText || 'unknown'}`));

          try {
            await page.goto('http://127.0.0.1:8080/?terrariumPreview=1', { waitUntil: 'domcontentloaded' });
            await page.waitForFunction(() => {
              if (globalThis.__haiveStartupError) throw new Error(globalThis.__haiveStartupError);
              return globalThis.__haiveNodeCreaturesReady === true &&
                globalThis.__haiveAppScriptLoaded === true;
            }, null, { timeout: 15000 });
            await page.waitForSelector('#webApp canvas', { timeout: 15000 });
            await page.waitForTimeout(1800);

            const state = await page.evaluate(() => ({
              rustReady: globalThis.HaiveNodeCreatures?.ready === true,
              bridgeReady: globalThis.__haiveNodeCreaturesReady === true,
              appScriptLoaded: globalThis.__haiveAppScriptLoaded === true,
              startupError: globalThis.__haiveStartupError || null,
              canvases: document.querySelectorAll('#webApp canvas').length,
              appChildren: document.getElementById('webApp')?.childNodes.length || 0,
            }));
            console.log('Browser state:', JSON.stringify(state));
            if (!state.rustReady || !state.bridgeReady || !state.appScriptLoaded || state.startupError || state.canvases < 1) {
              throw new Error(`Terrarium did not reach a Rust-rendered ready state: ${JSON.stringify(state)}`);
            }

            await page.screenshot({ path: 'visual-proof/haive-terrarium-wasm.png' });
          } catch (error) {
            console.error(error.stack || error);
            console.error('=== Browser diagnostics ===');
            for (const entry of diagnostics) console.error(entry);
            console.error('=== DOM ===');
            console.error(await page.content());
            process.exitCode = 1;
          } finally {
            await browser.close();
          }
          JS

          if ! node visual-proof/haive-terrarium-proof.mjs; then
            echo "=== HTTP server log ==="
            cat /tmp/haive-terrarium-http.log || true
            echo "=== Staged files ==="
            find webApp/build/terrarium-proof -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
            exit 1
          fi

          test -s visual-proof/haive-terrarium-wasm.png
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from collections import Counter

          image = Image.open("visual-proof/haive-terrarium-wasm.png").convert("RGB")
          colors = Counter(image.getdata())
          background = (18, 18, 18)
          non_background = image.width * image.height - colors.get(background, 0)
          distinct = len(colors)
          print(f"Visual proof: {image.width}x{image.height}, {distinct} colors, {non_background} non-background pixels")
          if distinct < 8 or non_background < 10000:
              raise SystemExit(
                  f"Terrarium visual proof is effectively blank: {distinct} colors, "
                  f"{non_background} non-background pixels"
              )
          PY

      - name: Upload terrarium screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: haive-terrarium-wasm-proof
          path: visual-proof/haive-terrarium-wasm.png
          if-no-files-found: warn
