name: Dependency Submission

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/dependency-submission.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Submit runtime dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          dependency-graph: generate-and-submit
          dependency-graph-include-projects: ':androidApp|:desktopApp|:webApp|:shared|:providers:jules'
          dependency-graph-include-configurations: '.*[Rr]untime.*'
          dependency-graph-continue-on-failure: false
          additional-arguments: '-Phaive.useLocalH2g2=false'
          cache-disabled: true
