name: Dependency Submission

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/dependency-submission.yml'
  workflow_dispatch:

# One dependency submission per repository at a time: a burst of pushes uses a single
# runner and only the newest snapshot runs, so this repo never crowds the account's
# shared concurrent-job limit for other repositories.
concurrency:
  group: ${{ github.repository }}-dependency-submission
  cancel-in-progress: true

# Dependency submission always runs in the target repository (HereLiesAz/workflows
# policy); the ci-report step registers it as target-local CI (`local`, `ci: true`).
permissions:
  contents: write
  id-token: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out h2g2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HereLiesAz/conveyance-h2g2
          ref: 8ff45ea2fbf91f8b2fb22a542a87efdf9b856f0c # pinned: README "Bumping the vendor pins"
          path: vendor/conveyance-h2g2

      - name: Check out Conveyance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HereLiesAz/Conveyance
          ref: 9d9a694c64d0bdfd1d6e9f38a1ad972bb5618ac4 # pinned: README "Bumping the vendor pins"
          path: vendor/conveyance-h2g2/vendor/Conveyance

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Submit runtime dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          dependency-graph: generate-and-submit
          dependency-graph-include-projects: ':androidApp|:desktopApp|:webApp|:shared|:providers:llm'
          dependency-graph-include-configurations: '.*[Rr]untime.*'
          dependency-graph-continue-on-failure: false
          additional-arguments: '-Phaive.useLocalH2g2=false'
          cache-disabled: true

      # Declares this as target-local CI to HereLiesAz/workflows; never fails the run.
      - name: Report CI
        if: always()
        uses: HereLiesAz/workflows/.github/actions/ci-report@main
