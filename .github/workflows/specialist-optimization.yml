name: Specialist Optimization

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "tools/specialist_optimization/**"
      - ".github/workflows/specialist-optimization.yml"
  workflow_dispatch:
    inputs:
      config_path:
        description: "Repository path to specialist optimization config"
        required: true
        type: string
      dataset_path:
        description: "Repository path to specialist JSONL corpus"
        required: true
        type: string

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Test optimization/release contract
        working-directory: tools/specialist_optimization
        run: python -m unittest -v test_pipeline.py

  optimize:
    if: github.event_name == 'workflow_dispatch'
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/specialist_optimization/requirements.txt
      - name: Install optimizer
        run: python -m pip install -r tools/specialist_optimization/requirements.txt
      - name: Optimize and gate specialist
        run: |
          python tools/specialist_optimization/pipeline.py \
            --config "${{ inputs.config_path }}" \
            --dataset "${{ inputs.dataset_path }}" \
            --output-dir build/specialist-release
      - name: Upload gated specialist release
        uses: actions/upload-artifact@v7
        with:
          name: specialist-release
          path: build/specialist-release/
          if-no-files-found: error
