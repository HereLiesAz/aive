name: Android CI

# Runs unit tests on every push/PR and builds the Android debug app.
# Signed Android releases (Play and GitHub) are built and published only by the central
# HereLiesAz/workflows runs; Build and Deploy publishes the desktop installers. This workflow publishes nothing.
# Dependency-graph submission lives only in dependency-submission.yml (path-filtered, single-flight).
# Target-local CI under HereLiesAz/workflows policy: each job ends with the central
# ci-report action, which registers this workflow `local`, `ci: true`.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out h2g2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HereLiesAz/conveyance-h2g2
          ref: 8ff45ea2fbf91f8b2fb22a542a87efdf9b856f0c # pinned: README "Bumping the vendor pins"
          path: vendor/conveyance-h2g2

      - name: Check out Conveyance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HereLiesAz/Conveyance
          ref: 9d9a694c64d0bdfd1d6e9f38a1ad972bb5618ac4 # pinned: README "Bumping the vendor pins"
          path: vendor/conveyance-h2g2/vendor/Conveyance

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install ffmpeg
        # FfmpegFilmPlanTest runs the real binary; on CI a missing ffmpeg fails it instead of skipping.
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg; then break; fi
            [ "$attempt" -lt 3 ] || exit 1
            sleep $((attempt * 10))
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-read-only: false
          dependency-graph: disabled

      # Plain Node, no install step: the relay Worker and the puppet-rig editor have tests that
      # no Gradle task runs, so a weakened relay gate or a broken rig validator would merge green.
      - name: Relay Worker tests
        run: |
          npm --prefix relay run check
          npm --prefix relay test

      - name: Puppet-rig editor tests
        run: |
          node --check tools/puppet-rig/app.js
          node --check tools/puppet-rig/rig-core.js
          node tools/puppet-rig/test/rig-core.mjs

      - name: Azphalt package tests
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm test

      - name: Clear compose-resource build cache entries
        run: rm -rf ~/.gradle/caches/build-cache/ || true

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew test --continue --build-cache --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'

      # The screenshot tests save every shot they assert on; keep them so a reviewer can look.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots
          path: shared/build/hive-screens/
          if-no-files-found: ignore
          retention-days: 14

      # Declares this as target-local CI to HereLiesAz/workflows; never fails the run.
      - name: Report CI
        if: always()
        uses: HereLiesAz/workflows/.github/actions/ci-report@main

  build-and-release:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out h2g2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HereLiesAz/conveyance-h2g2
          ref: 8ff45ea2fbf91f8b2fb22a542a87efdf9b856f0c # pinned: README "Bumping the vendor pins"
          path: vendor/conveyance-h2g2

      - name: Check out Conveyance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HereLiesAz/Conveyance
          ref: 9d9a694c64d0bdfd1d6e9f38a1ad972bb5618ac4 # pinned: README "Bumping the vendor pins"
          path: vendor/conveyance-h2g2/vendor/Conveyance

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Rust Android toolchain
        id: retry5
        continue-on-error: true
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Rust Android toolchain (retry after a failed download)
        if: steps.retry5.outcome == 'failure'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        id: retry6
        continue-on-error: true
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-ndk

      - name: Install cargo-ndk (retry after a failed download)
        if: steps.retry6.outcome == 'failure'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-ndk

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          cache-read-only: false
          dependency-graph: disabled

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android debug distributions
        id: gradle-build
        run: |
          set +e
          ./gradlew :androidApp:assemblePlayDebug :androidApp:assembleGithubDebug --build-cache --no-daemon > build.log 2>&1
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          cat build.log
          exit "$EXIT_CODE"

      - name: Run Android release lint
        id: release-lint
        run: |
          set -o pipefail
          ./gradlew             :androidApp:lintVitalPlayRelease             :androidApp:lintVitalGithubRelease             --build-cache --no-daemon 2>&1 | tee lint.log

      - name: Report build failure
        if: failure() && (steps.gradle-build.outcome == 'failure' || steps.release-lint.outcome == 'failure') && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const lintFailed = '${{ steps.release-lint.outcome }}' === 'failure';
            const logFile = lintFailed ? 'lint.log' : 'build.log';
            let logTail = 'Log file not found.';
            try { logTail = fs.readFileSync(logFile, 'utf8').slice(-4000); } catch (e) {}
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${lintFailed ? 'Release Lint' : 'Build'} Failure on ${context.eventName === 'pull_request' ? 'PR #' + context.issue.number : context.ref}`,
              body: `The main-branch ${lintFailed ? 'release lint' : 'build'} failed.\n\n**Log (last 4000 characters):**\n\`\`\`\n${logTail}\n\`\`\``,
              labels: ['bug']
            });

      # Declares this as target-local CI to HereLiesAz/workflows; never fails the run.
      - name: Report CI
        if: always()
        uses: HereLiesAz/workflows/.github/actions/ci-report@main
