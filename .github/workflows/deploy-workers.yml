# Deploys the two Cloudflare Workers that live in this repository: `relay/` (the opaque
# Remote-access relay) and `connector/` (the Claude connector). Manual, or when a change to
# either directory reaches main. Needs the repository secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID. Worker secrets (for example CONNECTOR_KEK) are set once with
# `wrangler secret put` and persist across deploys; this workflow never sets or prints them.
name: Deploy Workers

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which Worker to deploy
        type: choice
        options:
          - both
          - relay
          - connector
        default: both
  push:
    branches:
      - main
    paths:
      - relay/**
      - connector/**
      - .github/workflows/deploy-workers.yml

permissions:
  contents: read

concurrency:
  group: deploy-workers
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'both' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Test relay
        if: env.TARGET != 'connector'
        working-directory: relay
        run: npm test

      - name: Deploy relay
        if: env.TARGET != 'connector'
        working-directory: relay
        run: npx --yes wrangler@4 deploy

      - name: Test connector
        if: env.TARGET != 'relay' && hashFiles('connector/wrangler.toml') != ''
        working-directory: connector
        run: npm test

      - name: Deploy connector
        if: env.TARGET != 'relay' && hashFiles('connector/wrangler.toml') != ''
        working-directory: connector
        run: npx --yes wrangler@4 deploy
