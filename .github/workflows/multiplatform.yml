name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_play:
        description: "Publish the Android bundle to the Google Play internal track"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Main/release runs must never be cancelled after an immutable tag has been created.
  # Pull-request runs may cancel stale commits so review CI does not starve the release runners.
  group: aive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve four-part build version
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_VERSION=$(grep '^app.versionName=' gradle.properties | cut -d'=' -f2- | tr -d '\r ')
          if ! printf '%s' "$SOURCE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::app.versionName must be MAJOR.MINOR.PATCH.BUILD"
            exit 1
          fi
          BASE_VERSION=$(printf '%s' "$SOURCE_VERSION" | cut -d. -f1-3)
          AIVE_VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          echo "AIVE_VERSION=$AIVE_VERSION" >> "$GITHUB_ENV"
          echo "Aive build version: $AIVE_VERSION"


      - name: Check out pinned h2g2
        uses: actions/checkout@v7
        with:
          repository: HereLiesAz/conveyance-h2g2
          ref: 8566a9db02d533d9534327df40424ee7b88ebe88
          path: vendor/conveyance-h2g2

      - name: Check out pinned Conveyance
        uses: actions/checkout@v7
        with:
          repository: HereLiesAz/Conveyance
          ref: b3e13674df9dfbcc0b35f800b57d78a305d07b03
          path: vendor/conveyance-h2g2/vendor/Conveyance

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Rust renderer toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Reconstruct and verify Android signing keystore
        id: signing
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/android-keystore
        with:
          keystore-private: ${{ secrets.KEYSTORE_PRIVATE }}
          keystore-rsa: ${{ secrets.KEYSTORE_RSA }}
          keystore-public: ${{ secrets.KEYSTORE_PUBLIC }}
          keystore-chain: ${{ secrets.KEYSTORE_CHAIN }}
          keystore-password: ${{ secrets.KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.KEY_ALIAS }}
          key-password: ${{ secrets.KEY_PASSWORD }}
          expected-sha256: ${{ secrets.KEYSTORE_SHA256 }}
          expected-sha1: ${{ secrets.KEYSTORE_SHA1 }}
          expected-owner: ${{ secrets.KEYSTORE_OWNER }}

      - name: Export Android signing path
        if: github.event_name != 'pull_request'
        run: |
          echo "HAIVE_KEYSTORE_PATH=${{ steps.signing.outputs.keystore-path }}" >> "$GITHUB_ENV"
          echo "HAIVE_KEYSTORE_TYPE=${{ steps.signing.outputs.store-type }}" >> "$GITHUB_ENV"

      - name: Select Android release versionCode
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          NOW_EPOCH=$(date -u +%s)
          VERSION_CODE=$((NOW_EPOCH - 1500000000))
          if [ "$VERSION_CODE" -le 0 ] || [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "::error::Generated Android versionCode $VERSION_CODE is outside the Play-supported range"
            exit 1
          fi
          echo "HAIVE_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Android release versionCode: $VERSION_CODE"

      - name: Test shared domain
        run: ./gradlew :shared:desktopTest

      - name: Test semantic workflow renderer
        run: ./gradlew -p vendor/conveyance-h2g2 desktopTest

      - name: Test Jules provider
        run: ./gradlew :providers:jules:desktopTest

      - name: Compile Jules provider Android
        run: ./gradlew :providers:jules:compileAndroidMain

      - name: Compile Jules provider JS
        run: ./gradlew :providers:jules:compileKotlinJs

      - name: Compile Jules provider Wasm
        run: ./gradlew :providers:jules:compileKotlinWasmJs

      - name: Test Android provider bootstrap
        run: ./gradlew :androidApp:testPlayDebugUnitTest :androidApp:testGithubDebugUnitTest

      - name: Build Android distributions
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew -Papp.versionName="$AIVE_VERSION" \
              :androidApp:assemblePlayDebug :androidApp:assembleGithubDebug
          else
            ./gradlew -Papp.versionCode="$HAIVE_VERSION_CODE" \
              -Papp.versionName="$AIVE_VERSION" \
              :androidApp:bundlePlayRelease \
              :androidApp:assembleGithubRelease
          fi

      - name: Verify Android native runtime packaging
        shell: bash
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -f "androidApp/build/generated/node-creatures/jniLibs/${abi}/libhaive_node_creatures.so"
            test -f "androidApp/build/generated/bitcos/jniLibs/${abi}/libhaive_bitcos.so"
          done

      - name: Publish pinned Conveyance for isolated web builds
        run: |
          ./gradlew -p vendor/conveyance-h2g2/vendor/Conveyance \
            :conveyance-core:publishToMavenLocal \
            :conveyance-compose:publishToMavenLocal

      - name: Publish pinned h2g2 for isolated web builds
        run: ./gradlew -p vendor/conveyance-h2g2 publishToMavenLocal

      - name: Build Web JS
        run: ./gradlew :webApp:jsBrowserProductionWebpack

      - name: Build Web Wasm
        run: ./gradlew :webApp:wasmJsBrowserProductionWebpack

      - name: Stage GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf webApp/build/pages

          JS_BUNDLE="$(find webApp/build -type f -path '*/js/productionExecutable/haive.js' -print -quit)"
          WASM_BUNDLE="$(find webApp/build -type f -path '*/wasmJs/productionExecutable/haive.js' -print -quit)"
          if [ -z "$JS_BUNDLE" ] || [ -z "$WASM_BUNDLE" ]; then
            echo "Production bundles found under webApp/build:"
            find webApp/build -type f -name 'haive.js' -print
            exit 1
          fi

          JS_DIR="$(dirname "$JS_BUNDLE")"
          WASM_DIR="$(dirname "$WASM_BUNDLE")"
          echo "Staging JS bundle from $JS_DIR"
          echo "Staging Wasm bundle from $WASM_DIR"

          mkdir -p webApp/build/pages/wasm
          cp -R "$JS_DIR"/. webApp/build/pages/
          cp -R "$WASM_DIR"/. webApp/build/pages/wasm/
          cp -R webApp/src/webMain/resources/. webApp/build/pages/
          cp -R webApp/src/webMain/resources/. webApp/build/pages/wasm/
          test -f webApp/build/pages/index.html
          test -f webApp/build/pages/haive.js
          test -f webApp/build/pages/node-creatures.js
          test -f webApp/build/pages/haive_node_creatures.wasm
          test -f webApp/build/pages/wasm/index.html
          test -f webApp/build/pages/wasm/haive.js
          test -f webApp/build/pages/wasm/node-creatures.js
          test -f webApp/build/pages/wasm/haive_node_creatures.wasm

      - name: Generate release notes
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fastlane/metadata/android/en-US/changelogs
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            git log "${LAST_TAG}..HEAD" --pretty=format:"- %s" --no-merges -n 50 \
              > fastlane/metadata/android/en-US/changelogs/default.txt
          else
            git log --pretty=format:"- %s" --no-merges -20 \
              > fastlane/metadata/android/en-US/changelogs/default.txt
          fi
          echo "=== Release notes ==="
          cat fastlane/metadata/android/en-US/changelogs/default.txt

      - name: Verify Play build excludes accessibility bridge
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            VARIANT_PATTERN='*playDebug*'
          else
            VARIANT_PATTERN='*playRelease*'
          fi
          MATCHES=$(find androidApp/build/intermediates -type f -path "$VARIANT_PATTERN" -name 'AndroidManifest.xml' -print)
          if [ -z "$MATCHES" ]; then
            echo "::error::Could not find merged Play manifest for $VARIANT_PATTERN"
            exit 1
          fi
          if printf '%s\n' "$MATCHES" | xargs grep -IlE 'InstalledGeminiAccessibilityService|BIND_ACCESSIBILITY_SERVICE' | grep -q .; then
            echo "::error::Play manifest contains the installed-Gemini accessibility bridge"
            exit 1
          fi
          if printf '%s\n' "$MATCHES" | xargs grep -IlE 'REQUEST_INSTALL_PACKAGES|androidx\.core\.content\.FileProvider|\.updates' | grep -q .; then
            echo "::error::Play manifest contains GitHub self-update/sideload components"
            exit 1
          fi

      - name: Verify GitHub build keeps accessibility bridge
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            VARIANT_PATTERN='*githubDebug*'
          else
            VARIANT_PATTERN='*githubRelease*'
          fi
          MATCHES=$(find androidApp/build/intermediates -type f -path "$VARIANT_PATTERN" -name 'AndroidManifest.xml' -print)
          if [ -z "$MATCHES" ]; then
            echo "::error::Could not find merged GitHub manifest for $VARIANT_PATTERN"
            exit 1
          fi
          if ! printf '%s\n' "$MATCHES" | xargs grep -Il 'InstalledGeminiAccessibilityService' | grep -q .; then
            echo "::error::GitHub manifest is missing the installed-Gemini accessibility bridge"
            exit 1
          fi
          if ! printf '%s\n' "$MATCHES" | xargs grep -Il 'REQUEST_INSTALL_PACKAGES' | grep -q .; then
            echo "::error::GitHub manifest is missing package-install permission for self-update"
            exit 1
          fi
          if ! printf '%s\n' "$MATCHES" | xargs grep -Il 'androidx.core.content.FileProvider' | grep -q .; then
            echo "::error::GitHub manifest is missing update FileProvider"
            exit 1
          fi

      - name: Upload GitHub Android release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: aive-android-github-release
          path: androidApp/build/outputs/apk/github/release/*.apk
          if-no-files-found: error

      - name: Upload Play Android release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: aive-android-play-release
          path: androidApp/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error

      - name: Upload release notes
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: aive-release-notes
          path: fastlane/metadata/android/en-US/changelogs/
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: webApp/build/pages

  desktop-packages:
    name: Desktop installer (${{ matrix.platform }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            task: packageDeb
            artifact: aive-desktop-linux
            path: desktopApp/build/compose/binaries/main/deb/*.deb
          - platform: windows
            runner: windows-latest
            task: packageMsi
            artifact: aive-desktop-windows
            path: desktopApp/build/compose/binaries/main/msi/*.msi
          - platform: macos
            runner: macos-latest
            task: packageDmg
            artifact: aive-desktop-macos
            path: desktopApp/build/compose/binaries/main/dmg/*.dmg

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Resolve four-part build version
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_VERSION=$(grep '^app.versionName=' gradle.properties | cut -d'=' -f2- | tr -d '\r ')
          if ! printf '%s' "$SOURCE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::app.versionName must be MAJOR.MINOR.PATCH.BUILD"
            exit 1
          fi
          BASE_VERSION=$(printf '%s' "$SOURCE_VERSION" | cut -d. -f1-3)
          AIVE_VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          echo "AIVE_VERSION=$AIVE_VERSION" >> "$GITHUB_ENV"
          echo "Aive build version: $AIVE_VERSION"


      - name: Check out pinned h2g2
        uses: actions/checkout@v7
        with:
          repository: HereLiesAz/conveyance-h2g2
          ref: 8566a9db02d533d9534327df40424ee7b88ebe88
          path: vendor/conveyance-h2g2

      - name: Check out pinned Conveyance
        uses: actions/checkout@v7
        with:
          repository: HereLiesAz/Conveyance
          ref: b3e13674df9dfbcc0b35f800b57d78a305d07b03
          path: vendor/conveyance-h2g2/vendor/Conveyance

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Rust renderer toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate and verify desktop icons
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :desktopApp:generateDesktopBrandAssets
          test -f desktopApp/build/generated/brand/desktop/haive-icon-color.png
          test -f desktopApp/build/generated/brand/desktop/haive-icon.ico
          test -f desktopApp/build/generated/brand/desktop/haive-icon.icns

      - name: Publish pinned Conveyance to Maven Local
        shell: bash
        run: |
          ./gradlew -p vendor/conveyance-h2g2/vendor/Conveyance \
            :conveyance-core:publishToMavenLocal \
            :conveyance-compose:publishToMavenLocal

      - name: Publish pinned h2g2 to Maven Local
        shell: bash
        run: ./gradlew -p vendor/conveyance-h2g2 publishToMavenLocal

      - name: Package native installer
        shell: bash
        run: |
          set +e
          ./gradlew -Papp.versionName="$AIVE_VERSION" ":desktopApp:${{ matrix.task }}"
          EXIT_CODE=$?
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "=== Native packaging diagnostics ==="
            if [ -d desktopApp/build/compose/logs ]; then
              find desktopApp/build/compose/logs -type f -print | while IFS= read -r log_file; do
                echo "--- $log_file ---"
                cat "$log_file"
              done
            else
              echo "No Compose packaging logs directory found."
            fi
          fi
          exit "$EXIT_CODE"

      - name: Verify desktop native runtime packaging
        shell: bash
        run: |
          set -euo pipefail
          find desktopApp/build/generated/node-creatures/desktop/node-creatures -type f -maxdepth 1 -print
          find desktopApp/build/generated/bitcos/desktop/bitcos -type f -maxdepth 1 -print
          test "$(find desktopApp/build/generated/node-creatures/desktop/node-creatures -type f -maxdepth 1 | wc -l | tr -d ' ')" -ge 1
          test "$(find desktopApp/build/generated/bitcos/desktop/bitcos -type f -maxdepth 1 | wc -l | tr -d ' ')" -ge 1

      - name: Upload native installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    name: Publish patch-grouped release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - build
    permissions:
      actions: read
      contents: write
      statuses: write
    uses: HereLiesAz/workflows/.github/workflows/multi-platform-app-release.yml@feat/patch-grouped-releases
    with:
      target_repository: ${{ github.repository }}
      target_repository_id: ${{ github.repository_id }}
      target_repository_owner: ${{ github.repository_owner }}
      target_repository_owner_id: ${{ github.repository_owner_id }}
      target_sha: ${{ github.sha }}
      target_check_sha: ${{ github.sha }}
      target_ref: ${{ github.ref }}
      target_ref_name: ${{ github.ref_name }}
      target_ref_type: ${{ github.ref_type }}
      target_head_ref: ${{ github.head_ref }}
      target_base_ref: ${{ github.base_ref }}
      target_actor: ${{ github.actor }}
      target_actor_id: ${{ github.actor_id }}
      target_event_name: ${{ github.event_name }}
      target_event_json: ${{ toJSON(github.event) }}
      target_inputs_json: ${{ toJSON(inputs) }}
      target_vars_json: ${{ toJSON(vars) }}
      target_run_id: ${{ github.run_id }}
      target_run_number: ${{ github.run_number }}
      target_run_attempt: ${{ github.run_attempt }}
      target_workflow_name: ${{ github.workflow }}
      source_workflow_path: .github/workflows/multiplatform.yml
      source_sha256: aive-central-multiplatform-release-v1
      target_repository_name: aive
      purpose_profile_json: |
        {
          "serialize": false,
          "prepare_command": "set -euo pipefail\nSOURCE_VERSION=$(grep '^app.versionName=' gradle.properties | cut -d'=' -f2- | tr -d '\\r ')\nif ! printf '%s' \"$SOURCE_VERSION\" | grep -Eq '^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$'; then echo '::error::app.versionName must be MAJOR.MINOR.PATCH.BUILD' >&2; exit 1; fi\nPATCH_VERSION=$(printf '%s' \"$SOURCE_VERSION\" | cut -d. -f1-3)\nversion=\"${PATCH_VERSION}.${TARGET_RUN_NUMBER}\"\ntag=\"v${PATCH_VERSION}\"\nbuild_tag=\"v${version}\"\ngh auth setup-git\ngit fetch --tags origin\nif git rev-parse \"refs/tags/$build_tag\" >/dev/null 2>&1; then existing=$(git rev-list -n1 \"$build_tag\"); test \"$existing\" = \"$TARGET_SHA\" || { echo \"::error::Immutable build tag $build_tag points to $existing, expected $TARGET_SHA\" >&2; exit 1; }; else git tag -a \"$build_tag\" \"$TARGET_SHA\" -m \"The Aive $version\"; git push origin \"$build_tag\"; fi\nrm -rf release-artifacts /tmp/aive-release-input\nmkdir -p release-artifacts /tmp/aive-release-input/android /tmp/aive-release-input/notes\ngh run download \"$TARGET_RUN_ID\" --repo \"$TARGET_REPOSITORY\" --name aive-android-github-release --dir /tmp/aive-release-input/android\ngh run download \"$TARGET_RUN_ID\" --repo \"$TARGET_REPOSITORY\" --name aive-release-notes --dir /tmp/aive-release-input/notes\napk=$(find /tmp/aive-release-input/android -type f -name '*.apk' -print -quit)\ntest -n \"$apk\" && test -s \"$apk\" || { echo '::error::Aive Android release artifact missing' >&2; exit 1; }\ncp \"$apk\" \"release-artifacts/TheAive-${version}-android.apk\"\nnotes=$(find /tmp/aive-release-input/notes -type f -name 'default.txt' -print -quit)\nif [ -n \"$notes\" ] && [ -s \"$notes\" ]; then cp \"$notes\" \"release-artifacts/TheAive-${version}-release-notes.txt\"; fi\necho \"version=$version\" >> \"$GITHUB_OUTPUT\"\necho \"tag=$tag\" >> \"$GITHUB_OUTPUT\"",
          "prepare_artifact_name": "aive-android-release",
          "prepare_artifact_path": "release-artifacts/*",
          "matrix": {
            "include": [
              {
                "os": "ubuntu-latest",
                "java_version": "21",
                "gradle": true,
                "artifact_name": "aive-desktop-linux",
                "prepare": "sudo apt-get update && sudo apt-get install -y fakeroot rpm && rustup toolchain install stable --profile minimal && rustup default stable && rm -rf vendor/conveyance-h2g2 && git clone https://github.com/HereLiesAz/conveyance-h2g2 vendor/conveyance-h2g2 && git -C vendor/conveyance-h2g2 checkout 8566a9db02d533d9534327df40424ee7b88ebe88 && git clone https://github.com/HereLiesAz/Conveyance vendor/conveyance-h2g2/vendor/Conveyance && git -C vendor/conveyance-h2g2/vendor/Conveyance checkout b3e13674df9dfbcc0b35f800b57d78a305d07b03 && ./gradlew -p vendor/conveyance-h2g2/vendor/Conveyance :conveyance-core:publishToMavenLocal :conveyance-compose:publishToMavenLocal && ./gradlew -p vendor/conveyance-h2g2 publishToMavenLocal",
                "build": "./gradlew -Papp.versionName=\"$RELEASE_VERSION\" :desktopApp:generateDesktopBrandAssets :desktopApp:packageDeb && mkdir -p release-artifacts && src=$(find desktopApp/build/compose/binaries/main/deb -type f -name '*.deb' -print -quit) && test -n \"$src\" && cp \"$src\" \"release-artifacts/TheAive-${RELEASE_VERSION}.deb\"",
                "artifact_path": "release-artifacts/*.deb"
              },
              {
                "os": "macos-latest",
                "java_version": "21",
                "gradle": true,
                "artifact_name": "aive-desktop-macos",
                "prepare": "rustup toolchain install stable --profile minimal && rustup default stable && rm -rf vendor/conveyance-h2g2 && git clone https://github.com/HereLiesAz/conveyance-h2g2 vendor/conveyance-h2g2 && git -C vendor/conveyance-h2g2 checkout 8566a9db02d533d9534327df40424ee7b88ebe88 && git clone https://github.com/HereLiesAz/Conveyance vendor/conveyance-h2g2/vendor/Conveyance && git -C vendor/conveyance-h2g2/vendor/Conveyance checkout b3e13674df9dfbcc0b35f800b57d78a305d07b03 && ./gradlew -p vendor/conveyance-h2g2/vendor/Conveyance :conveyance-core:publishToMavenLocal :conveyance-compose:publishToMavenLocal && ./gradlew -p vendor/conveyance-h2g2 publishToMavenLocal",
                "build": "./gradlew -Papp.versionName=\"$RELEASE_VERSION\" :desktopApp:generateDesktopBrandAssets :desktopApp:packageDmg && mkdir -p release-artifacts && src=$(find desktopApp/build/compose/binaries/main/dmg -type f -name '*.dmg' -print -quit) && test -n \"$src\" && cp \"$src\" \"release-artifacts/TheAive-${RELEASE_VERSION}.dmg\"",
                "artifact_path": "release-artifacts/*.dmg"
              },
              {
                "os": "windows-latest",
                "java_version": "21",
                "gradle": true,
                "shell": "pwsh",
                "artifact_name": "aive-desktop-windows",
                "prepare": "rustup toolchain install stable --profile minimal; rustup default stable; if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) { choco install wixtoolset --version=3.14.1 -y --no-progress; $wixBin = Get-ChildItem \"C:\\Program Files (x86)\\WiX Toolset*\\bin\" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1; if (-not $wixBin) { throw 'WiX install failed' }; Add-Content -Path $env:GITHUB_PATH -Value $wixBin.FullName }; Remove-Item -Recurse -Force vendor/conveyance-h2g2 -ErrorAction SilentlyContinue; git clone https://github.com/HereLiesAz/conveyance-h2g2 vendor/conveyance-h2g2; git -C vendor/conveyance-h2g2 checkout 8566a9db02d533d9534327df40424ee7b88ebe88; git clone https://github.com/HereLiesAz/Conveyance vendor/conveyance-h2g2/vendor/Conveyance; git -C vendor/conveyance-h2g2/vendor/Conveyance checkout b3e13674df9dfbcc0b35f800b57d78a305d07b03; ./gradlew.bat -p vendor/conveyance-h2g2/vendor/Conveyance :conveyance-core:publishToMavenLocal :conveyance-compose:publishToMavenLocal; ./gradlew.bat -p vendor/conveyance-h2g2 publishToMavenLocal",
                "build": "./gradlew.bat -Papp.versionName=\"$env:RELEASE_VERSION\" :desktopApp:generateDesktopBrandAssets :desktopApp:packageMsi; New-Item -ItemType Directory -Force release-artifacts | Out-Null; $src=(Get-ChildItem desktopApp/build/compose/binaries/main/msi/*.msi | Select-Object -First 1).FullName; if (-not $src) { throw 'MSI missing' }; Copy-Item $src \"release-artifacts/TheAive-$env:RELEASE_VERSION.msi\"",
                "artifact_path": "release-artifacts/*.msi"
              }
            ]
          },
          "allow_partial": false,
          "release_when": "always",
          "tag_mode": "prepare-output",
          "force_tag": false,
          "reuse_existing_tag": true,
          "migrate_build_releases": true,
          "prerelease": true,
          "title_template": "The Aive $TAG",
          "body_template": "All builds in patch line $TAG are grouped in this release. Exact four-part build tags remain immutable. Latest added build: $VERSION from commit $BUILD_SHA."
        }
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  publish-play:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_play) }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Play Android release bundle
        uses: actions/download-artifact@v8
        with:
          name: aive-android-play-release
          path: android-release

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: aive-release-notes
          path: fastlane/metadata/android/en-US/changelogs

      - name: Prepare Google Play localized release notes
        shell: bash
        run: |
          set -euo pipefail
          NOTES_DIR="fastlane/metadata/android/en-US/changelogs"
          test -s "$NOTES_DIR/default.txt"
          cp "$NOTES_DIR/default.txt" "$NOTES_DIR/whatsnew-en-US"

      - name: Publish to Google Play internal track
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hereliesaz.aive
          releaseFiles: android-release/**/*.aab
          track: internal
          status: completed
          whatsNewDirectory: fastlane/metadata/android/en-US/changelogs
