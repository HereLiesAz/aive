name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_play:
        description: "Publish the Android bundle to the Google Play internal track"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Main/release runs must never be cancelled after an immutable tag has been created.
  # Pull-request runs may cancel stale commits so review CI does not starve the release runners.
  group: aive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve four-part build version
        # TODO: pin HereLiesAz/workflows to a specific commit SHA instead of @main
        uses: HereLiesAz/workflows/.github/actions/four-part-version@main
        with:
          source-version-file: gradle.properties
          source-version-key: app.versionName
          build-number: ${{ github.run_number }}
          prerelease-major-max: "0"
          environment-variable: AIVE_VERSION


      - name: Check out pinned h2g2
        uses: actions/checkout@v7
        with:
          repository: HereLiesAz/conveyance-h2g2
          ref: 060231873e51d64082c43208a585a6ebb4a71ed5
          path: vendor/conveyance-h2g2

      - name: Check out pinned Conveyance
        uses: actions/checkout@v7
        with:
          repository: HereLiesAz/Conveyance
          ref: ec32af47a3dbe36fc87cd4643c54121ed702579d
          path: vendor/conveyance-h2g2/vendor/Conveyance

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Rust native toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Reconstruct and verify Android signing keystore
        id: signing
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/android-keystore
        with:
          keystore-private: ${{ secrets.KEYSTORE_PRIVATE }}
          keystore-rsa: ${{ secrets.KEYSTORE_RSA }}
          keystore-public: ${{ secrets.KEYSTORE_PUBLIC }}
          keystore-chain: ${{ secrets.KEYSTORE_CHAIN }}
          keystore-password: ${{ secrets.KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.KEY_ALIAS }}
          key-password: ${{ secrets.KEY_PASSWORD }}
          expected-sha256: ${{ secrets.KEYSTORE_SHA256 }}
          expected-sha1: ${{ secrets.KEYSTORE_SHA1 }}
          expected-owner: ${{ secrets.KEYSTORE_OWNER }}

      - name: Export Android signing path
        if: github.event_name != 'pull_request'
        run: |
          echo "HAIVE_KEYSTORE_PATH=${{ steps.signing.outputs.keystore-path }}" >> "$GITHUB_ENV"
          echo "HAIVE_KEYSTORE_TYPE=${{ steps.signing.outputs.store-type }}" >> "$GITHUB_ENV"

      - name: Select Android release versionCode
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          NOW_EPOCH=$(date -u +%s)
          VERSION_CODE=$((NOW_EPOCH - 1500000000))
          if [ "$VERSION_CODE" -le 0 ] || [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "::error::Generated Android versionCode $VERSION_CODE is outside the Play-supported range"
            exit 1
          fi
          echo "HAIVE_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Android release versionCode: $VERSION_CODE"

      - name: Verify release immutability policy
        run: python3 .github/scripts/verify_release_immutability.py

      - name: Test shared domain
        run: ./gradlew :shared:desktopTest

      - name: Test semantic workflow renderer
        run: ./gradlew -p vendor/conveyance-h2g2 desktopTest

      - name: Test Jules provider
        run: ./gradlew :providers:jules:desktopTest

      - name: Test LLM providers
        run: ./gradlew :providers:llm:desktopTest

      - name: Compile Jules provider Android
        run: ./gradlew :providers:jules:compileAndroidMain

      - name: Compile Jules provider JS
        run: ./gradlew :providers:jules:compileKotlinJs

      - name: Compile Jules provider Wasm
        run: ./gradlew :providers:jules:compileKotlinWasmJs

      - name: Test Android provider bootstrap
        run: ./gradlew :androidApp:testPlayDebugUnitTest :androidApp:testGithubDebugUnitTest

      - name: Build Android distributions
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Release minification runs on PRs too, so R8 keep-rule breaks surface before main.
            ./gradlew -Papp.versionName="$AIVE_VERSION" \
              :androidApp:assemblePlayDebug :androidApp:assembleGithubDebug \
              :androidApp:minifyPlayReleaseWithR8 :androidApp:minifyGithubReleaseWithR8
          else
            ./gradlew -Papp.versionCode="$HAIVE_VERSION_CODE" \
              -Papp.versionName="$AIVE_VERSION" \
              :androidApp:bundlePlayRelease \
              :androidApp:assembleGithubRelease
          fi

      - name: Verify Android native runtime packaging
        shell: bash
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in \
              "androidApp/build/generated/bitcos/jniLibs/${abi}/libhaive_bitcos.so" \
              "androidApp/build/generated/djl-tokenizer/jniLibs/${abi}/libdjl_tokenizer.so"; do
              if [ ! -f "$lib" ]; then
                echo "::error::Expected native runtime library was not found: $lib"
                exit 1
              fi
            done
          done

      - name: Verify 16 KB native library alignment
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          # Google Play requires every 64-bit native library to use >= 16 KB LOAD alignment.
          AAB=$(find androidApp/build/outputs/bundle/playRelease -name '*.aab' -print -quit)
          test -n "$AAB"
          WORK=$(mktemp -d)
          unzip -q "$AAB" 'base/lib/*' -d "$WORK"
          bad=0
          for so in $(find "$WORK/base/lib/arm64-v8a" "$WORK/base/lib/x86_64" -name '*.so' 2>/dev/null); do
            align=$(readelf -lW "$so" | awk '/LOAD/ {print $NF}' | sort -u | head -1)
            name=$(basename "$so")
            if [ $((align)) -lt 16384 ]; then
              echo "::error::$name is ${align}-aligned; 16 KB required"
              bad=1
            fi
          done
          exit $bad

      - name: Publish pinned Conveyance for isolated web builds
        run: |
          ./gradlew -p vendor/conveyance-h2g2/vendor/Conveyance \
            :conveyance-core:publishToMavenLocal \
            :conveyance-compose:publishToMavenLocal

      - name: Publish pinned h2g2 for isolated web builds
        run: ./gradlew -p vendor/conveyance-h2g2 publishToMavenLocal

      - name: Build Web JS
        run: ./gradlew :webApp:jsBrowserProductionWebpack

      - name: Build Web Wasm
        run: ./gradlew :webApp:wasmJsBrowserProductionWebpack

      - name: Stage GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf webApp/build/pages

          JS_BUNDLE="$(find webApp/build -type f -path '*/js/productionExecutable/haive.js' -print -quit)"
          WASM_BUNDLE="$(find webApp/build -type f -path '*/wasmJs/productionExecutable/haive.js' -print -quit)"
          if [ -z "$JS_BUNDLE" ] || [ -z "$WASM_BUNDLE" ]; then
            echo "Production bundles found under webApp/build:"
            find webApp/build -type f -name 'haive.js' -print
            exit 1
          fi

          JS_DIR="$(dirname "$JS_BUNDLE")"
          WASM_DIR="$(dirname "$WASM_BUNDLE")"
          echo "Staging JS bundle from $JS_DIR"
          echo "Staging Wasm bundle from $WASM_DIR"

          mkdir -p webApp/build/pages/wasm
          cp -R "$JS_DIR"/. webApp/build/pages/
          cp -R "$WASM_DIR"/. webApp/build/pages/wasm/
          cp -R webApp/src/webMain/resources/. webApp/build/pages/
          cp -R webApp/src/webMain/resources/. webApp/build/pages/wasm/
          for staged in \
            webApp/build/pages/index.html \
            webApp/build/pages/haive.js \
            webApp/build/pages/wasm/index.html \
            webApp/build/pages/wasm/haive.js; do
            if [ ! -f "$staged" ]; then
              echo "::error::Expected staged GitHub Pages file was not found: $staged"
              exit 1
            fi
          done

      - name: Generate release notes
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fastlane/metadata/android/en-US/changelogs
          # Search from HEAD^ so a re-run of an already-tagged commit still diffs against
          # the previous release instead of its own tag (which yields empty notes).
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            git log "${LAST_TAG}..HEAD" --pretty=format:"- %s" --no-merges -n 50 \
              > fastlane/metadata/android/en-US/changelogs/default.txt
          else
            git log --pretty=format:"- %s" --no-merges -20 \
              > fastlane/metadata/android/en-US/changelogs/default.txt
          fi
          # Google Play publishing requires non-empty notes.
          if [ ! -s fastlane/metadata/android/en-US/changelogs/default.txt ]; then
            git log -1 --pretty=format:"- %s" \
              > fastlane/metadata/android/en-US/changelogs/default.txt
          fi
          echo "=== Release notes ==="
          cat fastlane/metadata/android/en-US/changelogs/default.txt

      - name: Verify Play build excludes accessibility bridge
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            VARIANT_PATTERN='*playDebug*'
          else
            VARIANT_PATTERN='*playRelease*'
          fi
          MATCHES=$(find androidApp/build/intermediates -type f -path "$VARIANT_PATTERN" -name 'AndroidManifest.xml' -print)
          if [ -z "$MATCHES" ]; then
            echo "::error::Could not find merged Play manifest for $VARIANT_PATTERN"
            exit 1
          fi
          if printf '%s\n' "$MATCHES" | xargs grep -IlE 'InstalledGeminiAccessibilityService|BIND_ACCESSIBILITY_SERVICE' | grep -q .; then
            echo "::error::Play manifest contains the installed-Gemini accessibility bridge"
            exit 1
          fi
          if printf '%s\n' "$MATCHES" | xargs grep -IlE 'REQUEST_INSTALL_PACKAGES|androidx\.core\.content\.FileProvider|\.updates' | grep -q .; then
            echo "::error::Play manifest contains GitHub self-update/sideload components"
            exit 1
          fi

      - name: Verify GitHub build keeps accessibility bridge
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            VARIANT_PATTERN='*githubDebug*'
          else
            VARIANT_PATTERN='*githubRelease*'
          fi
          MATCHES=$(find androidApp/build/intermediates -type f -path "$VARIANT_PATTERN" -name 'AndroidManifest.xml' -print)
          if [ -z "$MATCHES" ]; then
            echo "::error::Could not find merged GitHub manifest for $VARIANT_PATTERN"
            exit 1
          fi
          if ! printf '%s\n' "$MATCHES" | xargs grep -Il 'InstalledGeminiAccessibilityService' | grep -q .; then
            echo "::error::GitHub manifest is missing the installed-Gemini accessibility bridge"
            exit 1
          fi
          if ! printf '%s\n' "$MATCHES" | xargs grep -Il 'REQUEST_INSTALL_PACKAGES' | grep -q .; then
            echo "::error::GitHub manifest is missing package-install permission for self-update"
            exit 1
          fi
          if ! printf '%s\n' "$MATCHES" | xargs grep -Il 'androidx.core.content.FileProvider' | grep -q .; then
            echo "::error::GitHub manifest is missing update FileProvider"
            exit 1
          fi

      - name: Upload GitHub Android release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: aive-android-github-release
          path: androidApp/build/outputs/apk/github/release/*.apk
          if-no-files-found: error

      - name: Upload GitHub Android R8 mapping
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: aive-android-github-mapping
          path: androidApp/build/outputs/mapping/githubRelease/mapping.txt
          if-no-files-found: error

      - name: Upload Play Android release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: aive-android-play-release
          path: androidApp/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error

      - name: Upload release notes
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: aive-release-notes
          path: fastlane/metadata/android/en-US/changelogs/
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: webApp/build/pages

  desktop-packages:
    name: Desktop installer (${{ matrix.platform }})
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            task: packageDeb
            artifact: aive-desktop-linux
            path: desktopApp/build/compose/binaries/main/deb/*.deb
          - platform: windows
            runner: windows-latest
            task: packageMsi
            artifact: aive-desktop-windows
            path: desktopApp/build/compose/binaries/main/msi/*.msi
          - platform: macos
            runner: macos-latest
            task: packageDmg
            artifact: aive-desktop-macos
            path: desktopApp/build/compose/binaries/main/dmg/*.dmg

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Resolve four-part build version
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_VERSION=$(grep '^app.versionName=' gradle.properties | cut -d'=' -f2- | tr -d '\r ')
          if ! printf '%s' "$SOURCE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::app.versionName must be MAJOR.MINOR.PATCH.BUILD"
            exit 1
          fi
          BASE_VERSION=$(printf '%s' "$SOURCE_VERSION" | cut -d. -f1-3)
          AIVE_VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          echo "AIVE_VERSION=$AIVE_VERSION" >> "$GITHUB_ENV"
          echo "Aive build version: $AIVE_VERSION"


      - name: Check out pinned h2g2
        uses: actions/checkout@v7
        with:
          repository: HereLiesAz/conveyance-h2g2
          ref: 060231873e51d64082c43208a585a6ebb4a71ed5
          path: vendor/conveyance-h2g2

      - name: Check out pinned Conveyance
        uses: actions/checkout@v7
        with:
          repository: HereLiesAz/Conveyance
          ref: ec32af47a3dbe36fc87cd4643c54121ed702579d
          path: vendor/conveyance-h2g2/vendor/Conveyance

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Rust native toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate and verify desktop icons
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :desktopApp:generateDesktopBrandAssets
          for icon in \
            desktopApp/build/generated/brand/desktop/haive-icon-color.png \
            desktopApp/build/generated/brand/desktop/haive-icon.ico \
            desktopApp/build/generated/brand/desktop/haive-icon.icns; do
            if [ ! -f "$icon" ]; then
              echo "::error::Expected generated desktop brand asset was not found: $icon"
              exit 1
            fi
          done

      - name: Publish pinned Conveyance to Maven Local
        shell: bash
        run: |
          ./gradlew -p vendor/conveyance-h2g2/vendor/Conveyance \
            :conveyance-core:publishToMavenLocal \
            :conveyance-compose:publishToMavenLocal

      - name: Publish pinned h2g2 to Maven Local
        shell: bash
        run: ./gradlew -p vendor/conveyance-h2g2 publishToMavenLocal

      - name: Package native installer
        shell: bash
        run: |
          set +e
          ./gradlew -Papp.versionName="$AIVE_VERSION" ":desktopApp:${{ matrix.task }}"
          EXIT_CODE=$?
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "=== Native packaging diagnostics ==="
            if [ -d desktopApp/build/compose/logs ]; then
              find desktopApp/build/compose/logs -type f -print | while IFS= read -r log_file; do
                echo "--- $log_file ---"
                cat "$log_file"
              done
            else
              echo "No Compose packaging logs directory found."
            fi
          fi
          exit "$EXIT_CODE"

      - name: Verify desktop native runtime packaging
        shell: bash
        run: |
          set -euo pipefail
          find desktopApp/build/generated/bitcos/desktop/bitcos -type f -maxdepth 1 -print
          test "$(find desktopApp/build/generated/bitcos/desktop/bitcos -type f -maxdepth 1 | wc -l | tr -d ' ')" -ge 1

      - name: Upload native installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    name: Publish patch-grouped release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - build
      - desktop-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download GitHub Android release
        uses: actions/download-artifact@v8
        with:
          name: aive-android-github-release
          path: release-input/android

      - name: Download Linux installer
        uses: actions/download-artifact@v8
        with:
          name: aive-desktop-linux
          path: release-input/linux

      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: aive-desktop-windows
          path: release-input/windows

      - name: Download macOS installer
        uses: actions/download-artifact@v8
        with:
          name: aive-desktop-macos
          path: release-input/macos

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: aive-release-notes
          path: release-input/notes

      - name: Derive four-part release version
        id: version
        # TODO: pin HereLiesAz/workflows to a specific commit SHA instead of @main
        uses: HereLiesAz/workflows/.github/actions/four-part-version@main
        with:
          source-version-file: gradle.properties
          source-version-key: app.versionName
          build-number: ${{ github.run_number }}
          prerelease-major-max: "0"

      - name: Prepare release assets
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files

          APK_SOURCE=$(find release-input/android -type f -name '*.apk' -print -quit)
          DEB_SOURCE=$(find release-input/linux -type f -name '*.deb' -print -quit)
          MSI_SOURCE=$(find release-input/windows -type f -name '*.msi' -print -quit)
          DMG_SOURCE=$(find release-input/macos -type f -name '*.dmg' -print -quit)

          for entry in \
            "APK_SOURCE:$APK_SOURCE" \
            "DEB_SOURCE:$DEB_SOURCE" \
            "MSI_SOURCE:$MSI_SOURCE" \
            "DMG_SOURCE:$DMG_SOURCE"; do
            label=${entry%%:*}
            value=${entry#*:}
            if [ -z "$value" ]; then
              echo "::error::Missing release asset: $label"
              find release-input -type f -print
              exit 1
            fi
          done

          cp "$APK_SOURCE" "release-files/TheAive-${VERSION_NAME}-android.apk"
          cp "$DEB_SOURCE" "release-files/TheAive-${VERSION_NAME}.deb"
          cp "$MSI_SOURCE" "release-files/TheAive-${VERSION_NAME}.msi"
          cp "$DMG_SOURCE" "release-files/TheAive-${VERSION_NAME}.dmg"

          NOTES_SOURCE=$(find release-input/notes -type f -name 'default.txt' -print -quit)
          {
            echo "# The Aive ${VERSION_NAME}"
            echo
            echo "Versioned build from commit \`${GITHUB_SHA}\`."
            if [ -n "$NOTES_SOURCE" ] && [ -s "$NOTES_SOURCE" ]; then
              echo
              echo "## Changes"
              cat "$NOTES_SOURCE"
            fi
          } > release-notes.md

      - name: Publish grouped patch release
        # TODO: pin HereLiesAz/workflows to a specific commit SHA instead of @main
        uses: HereLiesAz/workflows/.github/actions/patch-grouped-release@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          target-repository: ${{ github.repository }}
          target-sha: ${{ github.sha }}
          build-version: ${{ steps.version.outputs.version }}
          assets: release-files/*
          title-prefix: The Aive
          notes-file: release-notes.md
          prerelease: ${{ steps.version.outputs.prerelease }}
          make-latest: "true"
          migrate-legacy-build-releases: "true"

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  publish-play:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_play) }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Play Android release bundle
        uses: actions/download-artifact@v8
        with:
          name: aive-android-play-release
          path: android-release

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: aive-release-notes
          path: fastlane/metadata/android/en-US/changelogs

      - name: Prepare Google Play localized release notes
        shell: bash
        run: |
          set -euo pipefail
          NOTES_DIR="fastlane/metadata/android/en-US/changelogs"
          test -s "$NOTES_DIR/default.txt"
          cp "$NOTES_DIR/default.txt" "$NOTES_DIR/whatsnew-en-US"

      - name: Publish to Google Play internal track
        # Shared publisher: uploads the bundle plus the R8 mapping.txt embedded in it.
        # TODO: pin HereLiesAz/workflows to a specific commit SHA instead of @main
        uses: HereLiesAz/workflows/.github/actions/google-play-publish@main
        with:
          service-account-json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          package-name: com.hereliesaz.aive
          aab-path: android-release/**/*.aab
          tracks: '[{"track":"internal","status":"completed"}]'
          release-notes-dir: fastlane/metadata/android/en-US/changelogs
