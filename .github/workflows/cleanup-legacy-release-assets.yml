name: Cleanup legacy rolling release assets

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.issue.title == '[maintenance] cleanup legacy rolling assets'
    runs-on: ubuntu-latest
    steps:
      - name: Remove pre-Aive rolling assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="latest-v0.9"

          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
          while IFS= read -r ASSET; do
            case "$ASSET" in
              TheHaive-*|thehaive_*)
                echo "Deleting legacy asset: $ASSET"
                gh release delete-asset "$TAG_NAME" "$ASSET" --repo "$GITHUB_REPOSITORY" --yes
                ;;
            esac
          done
