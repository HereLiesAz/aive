name: BITCOS Engine

on:
  pull_request:
    paths:
      - 'native/bitcos/**'
      - 'shared/src/commonMain/kotlin/com/hereliesaz/geministrator/inference/LocalModelLibrary.kt'
      - 'shared/src/commonTest/kotlin/com/hereliesaz/geministrator/inference/LocalModelLibraryTest.kt'
      - 'docs/architecture/BITCOS.md'
      - 'docs/architecture/COMPOUND_INFERENCE.md'
      - '.github/workflows/bitcos-engine.yml'
  push:
    branches:
      - main
    paths:
      - 'native/bitcos/**'
      - 'shared/src/commonMain/kotlin/com/hereliesaz/geministrator/inference/LocalModelLibrary.kt'
      - 'shared/src/commonTest/kotlin/com/hereliesaz/geministrator/inference/LocalModelLibraryTest.kt'
      - 'docs/architecture/BITCOS.md'
      - 'docs/architecture/COMPOUND_INFERENCE.md'
      - '.github/workflows/bitcos-engine.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  bitcos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        id: retry4
        continue-on-error: true
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install stable Rust (retry after a failed download)
        if: steps.retry4.outcome == 'failure'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Rust tests
        run: cargo test --manifest-path native/bitcos/Cargo.toml --all-targets

      - name: Release build
        run: cargo build --manifest-path native/bitcos/Cargo.toml --release

      - name: Format check
        run: cargo fmt --manifest-path native/bitcos/Cargo.toml -- --check

      - name: Lint
        run: cargo clippy --manifest-path native/bitcos/Cargo.toml --all-targets -- -D warnings

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Shared planner tests
        run: ./gradlew :shared:desktopTest --tests '*LocalModelLibraryTest*'

      # Declares this as target-local CI to HereLiesAz/workflows; never fails the run.
      - name: Report CI
        if: always()
        uses: HereLiesAz/workflows/.github/actions/ci-report@main
