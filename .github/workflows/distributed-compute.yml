name: Distributed Compute

on:
  pull_request:
    paths:
      - 'computeRelay/**'
      - 'shared/src/commonMain/kotlin/com/hereliesaz/geministrator/distributed/**'
      - 'shared/src/commonMain/kotlin/com/hereliesaz/geministrator/domain/DistributedCompute.kt'
      - 'shared/src/commonMain/kotlin/com/hereliesaz/geministrator/domain/Models.kt'
      - 'shared/src/commonMain/kotlin/com/hereliesaz/geministrator/workflow/TaskExecutorIntegration.kt'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - '.github/workflows/distributed-compute.yml'
  push:
    branches:
      - main
    paths:
      - 'computeRelay/**'
      - 'shared/src/commonMain/kotlin/com/hereliesaz/geministrator/distributed/**'
      - 'shared/src/commonMain/kotlin/com/hereliesaz/geministrator/domain/DistributedCompute.kt'
      - 'shared/src/commonMain/kotlin/com/hereliesaz/geministrator/domain/Models.kt'
      - 'shared/src/commonMain/kotlin/com/hereliesaz/geministrator/workflow/TaskExecutorIntegration.kt'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - '.github/workflows/distributed-compute.yml'

permissions:
  contents: read

jobs:
  distributed-compute:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile shared transport
        run: ./gradlew :shared:compileKotlinDesktop

      - name: Test shared workflow integration
        run: ./gradlew :shared:jvmTest

      - name: Test relay
        run: ./gradlew :computeRelay:test

      - name: Build relay distribution
        run: ./gradlew :computeRelay:installDist
