name: Inspect epoch-8 memory artifacts

on:
  push:
    branches:
      - chore/inspect-epoch8-layout

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download representative epoch-8 bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/epoch8
          curl -fL --retry 3 \
            -o /tmp/epoch8/association.tar.gz \
            https://github.com/HereLiesAz/aive/releases/download/memory-layer-epoch8/haive-specialist_08_association_linker-onnx-epoch8.tar.gz
          curl -fL --retry 3 \
            -o /tmp/epoch8/noun.tar.gz \
            https://github.com/HereLiesAz/aive/releases/download/memory-layer-epoch8/haive-specialist_03_noun_indexer-int8-epoch8.tar.gz
          sha256sum /tmp/epoch8/*.tar.gz

      - name: List and extract bundles
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ASSOCIATION ARCHIVE ==='
          tar -tzf /tmp/epoch8/association.tar.gz | sed -n '1,240p'
          echo '=== NOUN ARCHIVE ==='
          tar -tzf /tmp/epoch8/noun.tar.gz | sed -n '1,240p'
          mkdir -p /tmp/epoch8/association /tmp/epoch8/noun
          tar -xzf /tmp/epoch8/association.tar.gz -C /tmp/epoch8/association
          tar -xzf /tmp/epoch8/noun.tar.gz -C /tmp/epoch8/noun
          echo '=== EXTRACTED FILES ==='
          find /tmp/epoch8/association /tmp/epoch8/noun -type f -printf '%p\t%s bytes\n' | sort

      - name: Inspect manifests and tokenizer metadata
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "=== $file ==="
            sed -n '1,220p' "$file"
          done < <(find /tmp/epoch8/association /tmp/epoch8/noun -type f \
            \( -name '*.json' -o -name '*.txt' -o -name '*.md' -o -name '*.jinja' \) \
            -size -256k | sort)

      - name: Inspect ONNX graph contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'onnx>=1.17,<2'
          python - <<'PY'
          from pathlib import Path
          import onnx

          roots = [Path('/tmp/epoch8/association'), Path('/tmp/epoch8/noun')]
          for root in roots:
              for path in sorted(root.rglob('*.onnx')):
                  print(f'=== ONNX {path} ===')
                  model = onnx.load(str(path), load_external_data=False)
                  print('ir_version:', model.ir_version)
                  print('opsets:', [(o.domain, o.version) for o in model.opset_import])
                  print('metadata:', {p.key: p.value for p in model.metadata_props})
                  initializer_names = {x.name for x in model.graph.initializer}
                  print('inputs:')
                  for value in model.graph.input:
                      if value.name in initializer_names:
                          continue
                      t = value.type.tensor_type
                      shape = []
                      for d in t.shape.dim:
                          shape.append(d.dim_param or d.dim_value or '?')
                      print(' ', value.name, 'elem_type=', t.elem_type, 'shape=', shape)
                  print('outputs:')
                  for value in model.graph.output:
                      t = value.type.tensor_type
                      shape = []
                      for d in t.shape.dim:
                          shape.append(d.dim_param or d.dim_value or '?')
                      print(' ', value.name, 'elem_type=', t.elem_type, 'shape=', shape)
          PY

      - name: Execute Specialist 08 and probe tokenizers
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'onnxruntime>=1.23,<2' 'tokenizers>=0.22,<1' 'transformers>=4.57,<6' 'numpy>=2,<3'
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import onnxruntime as ort
          from tokenizers import Tokenizer
          from transformers import AutoTokenizer

          assoc = Path('/tmp/epoch8/association/onnx')
          tokenizer = Tokenizer.from_file(str(assoc / 'tokenizer.json'))
          tokenizer.enable_padding()
          tokenizer.enable_truncation(max_length=256)
          texts = [
              'API timeout is configured for 30 seconds.',
              'API timeout is configured for 60 seconds.',
              'The UI uses a dark theme.',
          ]
          encoded = tokenizer.encode_batch(texts)
          max_len = max(len(e.ids) for e in encoded)
          ids = np.asarray([e.ids + [0] * (max_len - len(e.ids)) for e in encoded], dtype=np.int64)
          masks = np.asarray([e.attention_mask + [0] * (max_len - len(e.attention_mask)) for e in encoded], dtype=np.int64)
          types = np.asarray([e.type_ids + [0] * (max_len - len(e.type_ids)) for e in encoded], dtype=np.int64)

          sess = ort.InferenceSession(str(assoc / 'model.onnx'), providers=['CPUExecutionProvider'])
          output_names = [o.name for o in sess.get_outputs()]
          values = sess.run(None, {
              'input_ids': ids,
              'attention_mask': masks,
              'token_type_ids': types,
          })
          print('association output names:', output_names)
          for name, value in zip(output_names, values):
              print('association output:', name, value.shape, value.dtype)
          hidden = values[output_names.index('last_hidden_state')]
          pooled_name = next(name for name in output_names if name != 'last_hidden_state')
          pooled = values[output_names.index(pooled_name)]
          expanded = masks[..., None].astype(np.float32)
          manual = (hidden * expanded).sum(axis=1) / np.clip(expanded.sum(axis=1), 1e-9, None)
          manual /= np.clip(np.linalg.norm(manual, axis=1, keepdims=True), 1e-12, None)
          print('pooled output name:', pooled_name)
          print('pooled norms:', np.linalg.norm(pooled, axis=1).tolist())
          print('manual-normalized max abs diff:', float(np.max(np.abs(pooled - manual))))
          normalized = pooled / np.clip(np.linalg.norm(pooled, axis=1, keepdims=True), 1e-12, None)
          print('similarity timeout30-timeout60:', float(normalized[0] @ normalized[1]))
          print('similarity timeout30-ui:', float(normalized[0] @ normalized[2]))

          noun_root = Path('/tmp/epoch8/noun')
          raw_qwen = Tokenizer.from_file(str(noun_root / 'tokenizer.json'))
          print('qwen tokenizer model:', type(raw_qwen.model).__name__)
          print('qwen pre_tokenizer:', raw_qwen.pre_tokenizer)
          print('qwen decoder:', raw_qwen.decoder)
          print('qwen post_processor:', raw_qwen.post_processor)

          hf = AutoTokenizer.from_pretrained(str(noun_root), local_files_only=True, trust_remote_code=False)
          rendered = hf.apply_chat_template(
              [{'role': 'user', 'content': 'Return one JSON object with noun/entity tags for this packet.'}],
              tokenize=False,
              add_generation_prompt=True,
          )
          token_ids = hf.apply_chat_template(
              [{'role': 'user', 'content': 'Return one JSON object with noun/entity tags for this packet.'}],
              tokenize=True,
              add_generation_prompt=True,
          )
          print('qwen chat template rendered repr:', repr(rendered))
          print('qwen chat token ids:', token_ids[:80])
          print('qwen chat token count:', len(token_ids))
          print('qwen eos token/id:', hf.eos_token, hf.eos_token_id)
          print('qwen pad token/id:', hf.pad_token, hf.pad_token_id)
          PY
