name: Node Creature Format Once

on:
  push:
    branches:
      - tmp-node-format

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out rustfmt repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/node-creature-rustfmt
          fetch-depth: 0
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Format node creature engine
        run: |
          cargo fmt --manifest-path native/node-creatures/Cargo.toml
          sed -i 's/{Activity, CreatureGenome, CreaturePose, RoleArchetype, TerminalKind}/{CreatureGenome, CreaturePose, RoleArchetype, TerminalKind}/' native/node-creatures/src/engine.rs
          cargo fmt --manifest-path native/node-creatures/Cargo.toml
      - name: Verify renderer after formatting
        run: |
          cargo test --manifest-path native/node-creatures/Cargo.toml --all-targets
          cargo fmt --manifest-path native/node-creatures/Cargo.toml -- --check
      - name: Commit formatted source
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/node-creatures/src/engine.rs native/node-creatures/src/genome.rs native/node-creatures/src/lib.rs
          git commit -m 'Format node creature engine'
          git push origin HEAD:fix/node-creature-rustfmt
