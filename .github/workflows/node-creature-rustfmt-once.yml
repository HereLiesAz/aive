name: Node Creature Rustfmt Once

on:
  push:
    branches:
      - feature/semantic-node-creatures
    paths:
      - 'native/node-creatures/**'
      - '.github/workflows/node-creature-rustfmt-once.yml'

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feature/semantic-node-creatures
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Format node-creature engine
        run: cargo fmt --manifest-path native/node-creatures/Cargo.toml

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- native/node-creatures; then
            echo "Rust source is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/node-creatures
          git commit -m "Format node creature Rust engine"
          git push origin HEAD:feature/semantic-node-creatures
