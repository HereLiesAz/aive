name: azp-package-release
# Build every Azphalt Store package under docs/azphalt-packages/ into a .azp and
# publish them all to the tagged GitHub Release. Packages are published unsigned;
# sign-azp.yml signs them afterwards with the centrally held publisher key.
on:
  push:
    tags: ['azp-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Pack .azp packages
        run: |
          npm install --no-audit --no-fund
          npm run build
          count=$(ls -1 build/azp/*.azp | wc -l)
          test "$count" -gt 0 || { echo "::error::no .azp packages were produced" >&2; exit 1; }
          echo "packed $count .azp packages"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/azp/*.azp
