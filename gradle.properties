org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true

# Single source of truth for app version across Android and Desktop.
# Version maturity is implicit in the number: 0.x = alpha, 1.0-1.3 = beta, 1.4+ = stable.
# No alpha/beta suffixes are used in version names, tags, or release titles.
# versionCode is Android-only; versionName drives both.
# Release CI overrides versionCode with a newer monotonic timestamp-derived value on main pushes.
app.versionCode=289442562
app.versionName=0.9.6

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
android.sync.suppressAgpWarnings=GENERIC
