org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true

# Single source of truth for the release line across Android and Desktop.
# Version format is MAJOR.MINOR.PATCH.BUILD. The checked-in BUILD is 0 for local/dev builds.
# Release CI replaces only BUILD with the monotonic GitHub Actions run number, so every main build
# has its own immutable identity (for example 0.9.6.412, then 0.9.6.413).
# Version maturity is implicit in the number: 0.x = alpha, 1.0-1.3 = beta, 1.4+ = stable.
# No alpha/beta suffixes are used in version names, tags, or release titles.
# versionCode is Android-only and remains independently monotonic for Google Play.
app.versionCode=289442562
app.versionName=0.9.6.0

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true